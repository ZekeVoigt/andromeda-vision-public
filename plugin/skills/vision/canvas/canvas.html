<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision</title>
<style>
:root { --bg: #111111; --ink: #ececea; --soft: #b5b5b2; --muted: #6b6b66; --line: #2a2a28; --accent: #ff7a4d; --card: rgba(24,24,23,.92); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f5f5f4; --ink: #151515; --soft: #55554f; --muted: #9a9a95; --line: #e0e0dc; --accent: #e4572e; --card: rgba(255,255,255,.94); } }
:root[data-theme="light"] { --bg: #f5f5f4; --ink: #151515; --soft: #55554f; --muted: #9a9a95; --line: #e0e0dc; --accent: #e4572e; --card: rgba(255,255,255,.94); }
:root[data-theme="dark"] { --bg: #111111; --ink: #ececea; --soft: #b5b5b2; --muted: #6b6b66; --line: #2a2a28; --accent: #ff7a4d; --card: rgba(24,24,23,.92); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, -apple-system, system-ui, sans-serif; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.grabbing { cursor: grabbing; } #gl.over { cursor: pointer; }
#leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#leaders line { stroke: var(--muted); stroke-width: 1; } #leaders circle { fill: var(--muted); }
#labels { position: absolute; inset: 0; pointer-events: none; }
.lbl { position: absolute; left: 0; top: 0; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap;
  background: var(--card); color: var(--ink); border: 1px solid var(--line); opacity: 0; transition: opacity .25s; pointer-events: none; will-change: transform; }
.lbl.on { opacity: 1; pointer-events: auto; cursor: pointer; } .lbl.sel { border-color: var(--accent); color: var(--accent); }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
</style>
</head><body>
<div id="stage"><canvas id="gl"></canvas><svg id="leaders"></svg><div id="labels"></div><div id="ui"></div></div>
<script id="three-src" type="text/plain">/*__THREE__*/</script>
<script id="see-data" type="application/json">/*__DATA__*/null</script>
<script type="module">
const THREE = await import(URL.createObjectURL(new Blob([document.getElementById('three-src').textContent], { type: 'text/javascript' })));
/*__CODE__*/
const core = makeCore(THREE, document.getElementById('gl'));
const SH = makeShapes(THREE), SC = makeScene(THREE, SH);
const SEE = makeApp(THREE, core, SC);
/*__UI__*/
const data = JSON.parse(document.getElementById('see-data').textContent || 'null');
if (data) await SEE.load(data);
window.SEE_READY = true;
</script>
</body></html>
