<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>See</title>
<style>
:root {
  --bg: #f5f5f4; --ink: #151515; --soft: #5f5f5c; --muted: #a3a3a0; --line: #e3e3e0; --accent: #e4572e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --ink: #ececea; --soft: #b5b5b2; --muted: #64645f; --line: #2a2a28; --accent: #ff7a4d;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --ink: #ececea; --soft: #b5b5b2; --muted: #64645f; --line: #2a2a28; --accent: #ff7a4d;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 44px 28px 72px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
h1 { font-size: 16px; font-weight: 500; margin: 0; letter-spacing: -0.005em; }
.controls { display: flex; gap: 6px; flex-shrink: 0; }
.controls button {
  font: inherit; font-size: 13px; color: var(--soft); background: none; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px;
}
.controls button:hover { color: var(--ink); border-color: var(--muted); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 44px; margin-top: 30px; align-items: start; }
.viz { position: relative; width: 100%; max-width: 520px; aspect-ratio: 1; cursor: grab; touch-action: none; user-select: none; overflow: hidden; }
.viz:active { cursor: grabbing; }
.viz canvas { width: 100%; height: 100%; display: block; }
.labels, .notes { position: absolute; inset: 0; pointer-events: none; }
.label {
  position: absolute; font: 12px/1.25 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--soft);
  white-space: nowrap; transform: translate(10px, -50%); transition: opacity .35s;
  background: color-mix(in srgb, var(--bg) 82%, transparent); padding: 1px 3px;
}
.label::before { content: ""; position: absolute; left: -7px; top: 50%; width: 4px; height: 4px; background: var(--ink); transform: translate(-50%, -50%); }
.label.focus { color: var(--ink); }
.note { position: absolute; color: var(--ink); line-height: 1.3; white-space: pre-wrap; transform: translate(-50%, -50%); text-align: center; transition: opacity .3s; }
.note.left { transform: translate(0, -50%); text-align: left; }
.note.lit { color: var(--accent); }
.note.bold { font-weight: 600; }
.status { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500; min-height: 22px; }
.status .t { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.glyph { display: grid; grid-template-columns: repeat(3, 3px); gap: 1.5px; }
.glyph i { width: 3px; height: 3px; background: var(--ink); opacity: .25; }
.glyph i.on { opacity: 1; }
ol.steps { list-style: none; margin: 12px 0 0; padding: 0 0 0 21px; }
.steps li { color: var(--muted); padding: 3px 0; cursor: pointer; font-size: 14px; transition: color .3s; }
.steps li:hover { color: var(--soft); }
.steps li.now { color: var(--ink); }
.steps li.hidden { display: none; }
.steps .detail { display: none; color: var(--soft); font-size: 13.5px; margin: 3px 0 5px; line-height: 1.5; }
.steps li.now .detail { display: block; }
.steps ul.pts { display: none; margin: 4px 0 6px; padding-left: 16px; color: var(--soft); font-size: 13px; line-height: 1.5; }
.steps li.now ul.pts { display: block; }
.steps ul.pts li { cursor: default; color: var(--soft); padding: 1px 0; }
.steps code, .detail code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--line); padding: 0 4px; border-radius: 3px; }
body.wide main { max-width: 1320px; }
body.wide .stage { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
body.wide .viz { max-width: 820px; }
body.world main { max-width: 1560px; }
body.world .stage { grid-template-columns: minmax(0, 2.1fr) minmax(300px, 1fr); gap: 36px; }
body.world .viz { max-width: none; aspect-ratio: 1.4; }
.summary { display: none; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 15px; }
.summary.show { display: block; animation: rise .5s ease; }
.summary p { margin: 0 0 12px; }
.summary ul { margin: 0 0 12px; padding-left: 20px; }
.summary li { margin: 4px 0; }
.summary code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--line); padding: 1px 4px; border-radius: 3px; }
.hint { margin-top: 18px; font-size: 12px; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  main { padding: 24px 16px 48px; }
  header { flex-direction: column; gap: 10px; }
  .stage, body.world .stage { grid-template-columns: 1fr; gap: 18px; }
  .viz { max-width: 100%; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="controls">
      <button id="prev" title="Previous (←)">←</button>
      <button id="play" title="Play / pause (space)">Pause</button>
      <button id="next" title="Next (→)">→</button>
    </div>
  </header>
  <div class="stage">
    <div class="viz" id="viz"><canvas id="c"></canvas><div class="notes" id="notes"></div><div class="labels" id="labels"></div></div>
    <div>
      <div class="status"><span class="glyph" id="glyph"></span><span id="phase">Seeing</span><span class="t" id="clock"></span></div>
      <ol class="steps" id="steps"></ol>
      <div class="summary" id="summary"></div>
      <div class="hint" id="hint">Drag to turn it · scroll to zoom · ← → to step · space to pause</div>
    </div>
  </div>
</main>

    gl.uniform1f(u.uGX, GX); gl.uniform1f(u.uGY, GY); gl.uniform1f(u.uAnimT, now - L.t0 - (L.morph ? DUR : 0) - 0.5); gl.uniform1f(u.uAlpha, al); gl.uniform1f(u.uDens, L.cloud.density ?? 1);
    gl.uniform3fv(u.uInk, ink); gl.uniform3fv(u.uSoft, soft); gl.uniform3fv(u.uAcc, accent);

  gl.disable(gl.BLEND); gl.bindVertexArray(null);

  maybeRebuild(now);

}

// labels and notes ride on the projection; labels show once the view has settled, spread apart
let lastR = null;
// a click names what is under it: the front-most point near the cursor, its part, a model's own part
window.seePick = (clientX, clientY) => {
  const T = layers[front], c = T.cloud; if (!c || !lastR || !c.pinfo) return null;
  const rect = canvas.getBoundingClientRect(), fx = (clientX - rect.left) / rect.width, fy = (clientY - rect.top) / rect.height;
  const { k, off } = frameOf(c), R = lastR, tx = 2.2 / GX, ty = 2.2 / GY;
  let best = -1, bestD = 1e9;
  for (let i = 0; i < N; i++) {
    if (c.flags[i] & 16) continue;
    const p = [c.P[i * 3] * k + off[0], c.P[i * 3 + 1] * k + off[1], c.P[i * 3 + 2] * k + off[2]];
    const q = rot(R, p), d = D - q[2]; if (d < 0.3 || d >= bestD) continue;
    const x = CXF + q[0] * FFP / (d * ASPECT), y = CYP - q[1] * FFP / d;
    if (Math.abs(x - fx) < tx && Math.abs(y - fy) < ty) { best = i; bestD = d; }
  }
  if (best < 0) return null;
  const info = c.pinfo[c.pid[best]] || {}, sub = c.SUB ? c.SUB[best] : -1, me = c.pid[best];
  // where on its part the click landed, -1..1 on each axis of the part's box (x right, y up, z front)
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (let i = 0; i < N; i++) if (c.pid[i] === me && !(c.flags[i] & 16)) for (let a = 0; a < 3; a++) { const v = c.P[i * 3 + a]; if (v < lo[a]) lo[a] = v; if (v > hi[a]) hi[a] = v; }
  const rel = [0, 1, 2].map(a => hi[a] > lo[a] ? +(((c.P[best * 3 + a] - lo[a]) / (hi[a] - lo[a])) * 2 - 1).toFixed(2) : 0);
  const at = [0, 1, 2].map(a => c.P[best * 3 + a] * c.cam.r + c.cam.c[a]); // the spot, in world terms
  const ids = info.ids || [], owner = info.id || (ids.length ? ids[ids.length - 1] : null);
  return { id: info.id, label: info.label, owner, ids, type: info.type, part: info.parts && sub >= 0 ? info.parts[sub] : null, rel, at };
};
// for the cursor (Claude's mark on the canvas): where a world point is on screen, where a spot on a
// named part is in the world, and a camera flight to a point
window.seeProject = w => {
  if (!lastR) return null;
  const q = rot(lastR, scl3(sub3(w, cam.c), 1 / cam.r)), d = D - q[2]; if (d < 0.3) return null;
  const rect = canvas.getBoundingClientRect();
  return [rect.left + (CXF + q[0] * FFP / (d * ASPECT)) * rect.width, rect.top + (CYP - q[1] * FFP / d) * rect.height];
};
window.seeLocate = (id, rel) => {
  const c = layers[front].cloud; if (!c || !c.pinfo) return null;
  const want = new Set(), k = String(id); c.pinfo.forEach((x, i) => { if (x && (x.id === k || x.label === k || (x.ids && x.ids.includes(k)))) want.add(i); });
  const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9]; let any = false;
  for (let i = 0; i < N; i++) if (want.has(c.pid[i]) && !(c.flags[i] & 16)) { any = true; for (let a = 0; a < 3; a++) { const v = c.P[i * 3 + a] * c.cam.r + c.cam.c[a]; if (v < lo[a]) lo[a] = v; if (v > hi[a]) hi[a] = v; } }
  if (!any) return null;
  const r = rel || [0, 0, 0];
  return [0, 1, 2].map(a => (lo[a] + hi[a]) / 2 + (hi[a] - lo[a]) / 2 * (r[a] || 0));
};
window.seeGo = (w, zoom) => {
  const now = performance.now() / 1000;
  if (playing) { playing = false; syncPlay(); }
  free = true; lastInput = now;
  fly = { a: Object.assign({}, cam, { c: cam.c.slice() }), b: { c: w.slice(), r: cam.r * (zoom || 1), yaw: cam.yaw, pitch: cam.pitch }, t0: now, dur: reduce ? 0.01 : 1.3, P: null, bump: 0 };
};
function overlay(now, R) {
  lastR = R;
  const T = layers[front], c = T.cloud; if (!c) return;
  const W = canvas.clientWidth, H = canvas.clientHeight, { k, off } = frameOf(c);
  const settled = !fly && (!T.morph || now - T.t0 > DUR + 0.4) && T.pts.at(now) > 0.95;
  const project = p => { const q = rot(R, add3(scl3(p, k), off)), d = D - q[2]; return [CXF + q[0] * FFP / (d * ASPECT), CYP - q[1] * FFP / d, d]; };
  const lab = document.getElementById('labels').children;
  const placed = [];
  c.labels.forEach((l, i) => {
    const [x, y, d] = project([l.p[0], l.p[1] + 0.03, l.p[2]]);
    const el = lab[i]; if (!el) return;
    if (d < 0.3 || x < -0.02 || x > 1.02 || y < -0.02 || y > 1.02) { el.style.opacity = 0; return; }
    placed.push({ i, x: x * 100, y: y * 100 - 1.2, l, w: (16 + l.text.length * 7.4) / W * 100 });
  });
  const ranked = stops[cur] && stops[cur].object ? placed : placed.sort((a, b) => (b.l.focus - a.l.focus) || (a.l.quiet - b.l.quiet) || (b.l.size - a.l.size));
  const limit = stops[cur] && stops[cur].focus ? 12 : 6; // the overview names only its biggest parts
  const pick = stops[cur] && Array.isArray(stops[cur].labels) ? new Set(stops[cur].labels) : null; // a stop may name its labels
  const shown = pick ? ranked.filter(q => pick.has(q.l.id)) : ranked.filter(q => q.l.focus || q.l.size > 0.035 || ranked.length <= limit).slice(0, limit);
  const hidden = new Set(ranked.filter(q => !shown.includes(q)).map(q => q.i));
  { const edge = ((PN.x || 0) + PN.w) * 100, left = (PN.x || 0) * 100; // inside the world's half: a label past its edge would sit under my words, so it hides
    for (let i = shown.length - 1; i >= 0; i--) { const q = shown[i]; if (edge < 99.5 && q.x > edge - 4) { hidden.add(q.i); shown.splice(i, 1); } else q.x = Math.max(left + 1.5, Math.min(q.x, edge - q.w - 1)); } }
  shown.sort((a, b) => a.y - b.y);
  const rowH = 19 / H * 100;
  for (let a = 0; a < shown.length; a++) for (let b = 0; b < a; b++) {
    const A = shown[a], B = shown[b];
    if (Math.abs(A.y - B.y) < rowH && A.x < B.x + B.w && B.x < A.x + A.w) A.y = B.y + rowH;
  }
  for (const q of shown) { const el = lab[q.i]; el.style.left = q.x + '%'; el.style.top = q.y + '%'; el.style.opacity = settled && !q.l.dim ? 1 : 0; }
  for (const i of hidden) lab[i].style.opacity = 0;
  const notes = document.getElementById('notes').children, nfade = T.morph ? (settled ? 1 : 0) : T.pts.at(now);
  c.notes.forEach((n, i) => {
    const el = notes[i]; if (!el) return;
    const [x, y, d] = project(n.p);
    const px = d > 0.3 ? n.size * k * FFP / d * H : 0;
    if (px < 6 || px > 140) { el.style.opacity = 0; return; }
    el.style.left = x * 100 + '%'; el.style.top = y * 100 + '%'; el.style.fontSize = (px / 1.3).toFixed(2) + 'px';
    el.style.width = n.width ? (n.width * k * FFP / d * H).toFixed(1) + 'px' : 'auto';
    el.style.whiteSpace = n.width ? 'pre-wrap' : 'pre';
    el.style.opacity = (Math.min(1, (px - 6) / 4) * nfade * (n.dim ? 0 : 1) * (n.tone < -0.3 ? 0.65 : 1)).toFixed(3);
  });
}

// ---------- building views: in a worker, so the page never stalls; on the page if it cannot ----------
const clouds = {}, jobs = {};
let pendingK = -1, worker = null, handle = null, freeKey = null, freeN = 0;
const send = m => (worker ? worker.postMessage(m) : handle && handle(m));
function arrived(key, c) {
  const j = jobs[key]; if (!j) return;
  c.view = c.autoView || j.view; c.w = j.w;
  if (key[0] === 'f') { // a view built for where the reader has taken the camera
    if (key === freeKey) { freeKey = null; if (free && j.k === cur) present(c, 'fade', performance.now() / 1000); }
    return;
  }
  clouds[key] = c;
  const k = +key.slice(1);
  if (k === pendingK) { pendingK = -1; go(k, performance.now() / 1000); }
}
function failed(key, message) {
  if (key && key[0] === 'f') { if (key === freeKey) freeKey = null; return; }
  document.getElementById('title').textContent = 'This scene could not be drawn: ' + message;
}
const onMsg = m => (m.type === 'cloud' ? arrived(m.key, m.c) : failed(m.key, m.message));
let allJobs = [];
function startBuilding(list) {
  allJobs = list;
  const geoText = document.getElementById('geo').textContent;
  const msg = { type: 'init', N, G, ASPECT: ASPECT * PANE, assets: S.assets || {}, worlds, jobs: list, images: decoded };
  try {
    worker = new Worker(URL.createObjectURL(new Blob([geoText], { type: 'text/javascript' })));
    let heard = false;
    worker.onmessage = ev => { heard = true; onMsg(ev.data); };
    worker.onerror = ev => { ev.preventDefault(); if (!heard) { worker.terminate(); worker = null; buildHere(geoText, list); } else failed(null, ev.message || 'worker error'); };
    worker.postMessage(msg, Object.values(decoded));
  } catch (err) { worker = null; buildHere(geoText, list); }
}
let decoded = {};
async function buildHere(geoText, list) { // the same code, run on the page
  const f = new Function(geoText + '\nreturn { makeRunner, decodeImages };')();
  const images = await f.decodeImages(S.assets || {}); // bitmaps sent to a dead worker are gone
  handle = f.makeRunner(onMsg);
  handle({ type: 'init', N, G, ASPECT: ASPECT * PANE, assets: S.assets || {}, worlds, jobs: list, images });
}
async function decodeImagesHere() {
  const f = new Function(document.getElementById('geo').textContent + '\nreturn decodeImages;')();
  return f(S.assets || {});
}
// once the reader has zoomed, panned or turned far enough, rebuild the view for where they are
function maybeRebuild(now) {
  if (!free || freeKey || fly || now - lastInput < 0.3 || dragging) return;
  const c = layers[front].cloud; if (!c) return;
  const yaw = eyeYaw(), pitch = eyePitch();
  const moved = Math.abs(Math.log(cam.r / c.cam.r)) > 0.16 || dist3(cam.c, c.cam.c) / cam.r > 0.16 || Math.abs(ang(yaw - c.view[0])) + Math.abs(pitch - c.view[1]) > 0.3;
  if (!moved) return;
  const key = 'f' + (++freeN), base = jobOf(cur);
  const j = Object.assign(base, { key, cam: { c: cam.c.slice(), r: cam.r }, view: [yaw, pitch], spin: false, seed: 50 + freeN, k: cur });
  jobs[key] = j; freeKey = key;
  send({ type: 'job', job: j, replace: 'f' });
}

// ---------- the steps ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
function md(text) {
  const src = Array.isArray(text) ? text.join('\n\n') : String(text || '');
  return src.split(/\n\s*\n/).map(b => {
    const lines = b.split('\n').filter(l => l.trim());
    if (lines.length && lines.every(l => /^\s*[-*] /.test(l)))
      return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>').join('') + '</ul>';
    return '<p>' + inline(lines.join(' ')) + '</p>';
  }).join('');
}

let cur = -1, reached = 0, playing = !reduce, stepAt = 0, began = 0, done = false, doneAt = 0;
const dwell = s => {
  const words = String(s.caption || '').length + String(s.detail || '').length + (Array.isArray(s.points) ? s.points.join(' ').length : 0);
  const moving = JSON.stringify(s.shape || []).includes('"animate"') || (s.animate && Object.keys(s.animate).length);
  return Math.max(moving ? 9000 : 3800, 1800 + 42 * words);
};
function go(k, now) {
  const c = clouds['s' + k], T = layers[front].cloud;
  if (free) { free = false; cam.yaw += dragYaw; cam.pitch = eyePitch(); dragYaw = 0; dragPitch = 0; }
  present(c, T && T.w === c.w ? 'fly' : 'morph', now); stepAt = now;
}
function show(k, now = performance.now() / 1000) {
  k = Math.max(0, Math.min(stops.length - 1, k));
  if (k !== cur || free) {
    cur = k;
    if (clouds['s' + k]) go(k, now);
    else { pendingK = k; send({ type: 'want', key: 's' + k }); document.getElementById('labels').innerHTML = ''; }
  }
  reached = Math.max(reached, k); stepAt = now;
  [...document.getElementById('steps').children].forEach((li, i) => {
    li.className = (i === k ? 'now' : '') + (i > reached && !done ? ' hidden' : '');
  });
}
function finish() {
  done = true; playing = false;
  document.getElementById('summary').classList.add('show');
  document.getElementById('play').textContent = 'Replay';
  show(cur);
}
function tickUI(now) {
  const g = document.getElementById('glyph').children, f = Math.floor(now * 6);
  for (let i = 0; i < 9; i++) g[i].className = (playing ? (i * 5 + f) % 9 < 4 : i % 2 === 0) ? 'on' : '';
  document.getElementById('phase').textContent = done ? 'Seen' : `Step ${cur + 1} of ${stops.length}`;
  document.getElementById('clock').textContent = ((done ? doneAt : now) - began).toFixed(1) + 's';
  if (playing && pendingK < 0 && !fly && now - stepAt > dwell(stops[cur]) / 1000) {
    if (cur < stops.length - 1) show(cur + 1, now); else { doneAt = now; finish(); }
  }
}

async function init() {
  if (!S || !stops.length) {
    document.getElementById('title').textContent = 'Nothing to see: this page was opened without a scene.';
    return;
  }
  document.title = S.title ? String(S.title).slice(0, 60) : 'See';
  document.getElementById('title').textContent = S.title || '';
  document.getElementById('glyph').innerHTML = '<i></i>'.repeat(9);
  if (WORLD) document.getElementById('hint').textContent = 'Drag to move · scroll to zoom · shift-drag to turn · ← → to step · space to pause';
  fitCanvas(); setupGL();
  decoded = await decodeImagesHere();
  const list = stops.map((s, k) => (jobs['s' + k] = jobOf(k)));
  const m = /step=(\d+)/.exec(location.hash); // #step=N opens paused on step N
  const first = m ? Math.max(0, Math.min(stops.length - 1, +m[1] - 1)) : 0;
  list.unshift(list.splice(first, 1)[0]);
  startBuilding(list); // every view builds off the page; the one on screen first
  // the canvas changed shape (the panel grew or shrank): re-plan every view for the new shape
  let reshapeT = 0;
  new ResizeObserver(() => {
    clearTimeout(reshapeT);
    reshapeT = setTimeout(() => {
      const r = document.getElementById('viz').getBoundingClientRect();
      if (r.width < 50 || r.height < 50) return;
      const a = Math.max(0.5, Math.min(2.6, r.width / r.height));
      const pn = paneOf();
      if (Math.abs(a / ASPECT - 1) < 0.02 && pn.w === PN.w && pn.h === PN.h && pn.x === PN.x) return;
      ASPECT = a; setPane(pn);
      for (const k in clouds) delete clouds[k];
      freeKey = null;
      const k = Math.max(0, cur);
      send({ type: 'aspect', ASPECT: ASPECT * PANE, jobs: allJobs, first: 's' + k });
      cur = -1; free = false; show(k);
    }, 220);
  }).observe(document.getElementById('viz'));
  document.getElementById('steps').innerHTML = stops.map((s, i) =>
    `<li data-i="${i}">${inline(s.caption || '')}${s.detail ? `<div class="detail">${inline(s.detail)}</div>` : ''}` +
    `${Array.isArray(s.points) && s.points.length ? `<ul class="pts">${s.points.map(t => `<li>${inline(t)}</li>`).join('')}</ul>` : ''}</li>`).join('');
  document.getElementById('summary').innerHTML = md(S.summary);
  document.getElementById('steps').addEventListener('click', e => {
    const li = e.target.closest('li[data-i]'); if (li) { playing = false; syncPlay(); show(+li.dataset.i); }
  });
  began = performance.now() / 1000;
  if (reduce) { done = true; document.getElementById('summary').classList.add('show'); }
  if (m) { playing = false; reached = stops.length; show(first); } else show(0);
  syncPlay();
  requestAnimationFrame(frame);
}
function syncPlay() { document.getElementById('play').textContent = done ? 'Replay' : playing ? 'Pause' : 'Play'; }
function step(d) { playing = false; syncPlay(); show(cur + d); }
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('play').onclick = () => {
  if (done && !reduce) { done = false; reached = 0; began = performance.now() / 1000; document.getElementById('summary').classList.remove('show'); playing = true; show(0); }
  else playing = !playing;
  syncPlay();
};
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === ' ') { e.preventDefault(); document.getElementById('play').click(); }
});

// ---------- the reader's own camera: drag to pan (a world) or turn (an object), scroll to zoom ----------
const viz = document.getElementById('viz');
let px0 = 0, py0 = 0;
const takeOver = () => { free = true; lastInput = performance.now() / 1000; if (playing) { playing = false; syncPlay(); } if (fly) { Object.assign(cam, camAt(fly, 1)); fly = null; } };
viz.addEventListener('contextmenu', e => e.preventDefault());
viz.addEventListener('pointerdown', e => {
  dragging = WORLD && e.button === 0 && !e.shiftKey ? 'pan' : 'turn';
  px0 = e.clientX; py0 = e.clientY; viz.setPointerCapture(e.pointerId);
});
viz.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px0, dy = e.clientY - py0; px0 = e.clientX; py0 = e.clientY;
  if (!dx && !dy) return;
  if (dragging === 'pan') {
    if (!free) { cam.yaw = eyeYaw(); sway = 0; }
    takeOver();
    const k = D / (FFP * viz.clientHeight) * cam.r, R = rows(eyeYaw(), eyePitch());
    cam.c = sub3(cam.c, unrot(R, [dx * k, -dy * k, 0]));
  } else {
    const k = 3.2 / viz.clientWidth;
    dragYaw += dx * k; dragPitch += dy * k;
    if (free) lastInput = performance.now() / 1000;
  }
});
const release = () => { if (dragging) { dragging = null; released = performance.now() / 1000; } };
viz.addEventListener('pointerup', release); viz.addEventListener('pointercancel', release);
viz.addEventListener('wheel', e => {
  e.preventDefault();
  if (!layers[front] || !layers[front].cloud) return;
  if (!free) { cam.yaw = eyeYaw(); sway = 0; }
  takeOver();
  const rect = viz.getBoundingClientRect(), xf = (e.clientX - rect.left) / rect.width, yf = (e.clientY - rect.top) / rect.height;
  const R = rows(eyeYaw(), eyePitch()), u = unrot(R, [(xf - CXF) * ASPECT * D / FFP, -(yf - CYP) * D / FFP, 0]);
  const P = add3(cam.c, scl3(u, cam.r)), r = Math.max(1e-6, cam.r * Math.exp(Math.max(-0.6, Math.min(0.6, e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)))));
  cam.r = r; cam.c = sub3(P, scl3(u, r)); // the point under the cursor stays under it
}, { passive: false });

init().catch(err => { document.getElementById('title').textContent = 'This scene could not be drawn: ' + err.message; console.error(err); });
</script>
</body>
