     the world fills it on the plain background, dots drift behind it, and no chat.

       image  one picture, one quiet line, nothing to press
       steps  the same, plus a small ← n/N → at the bottom and each stop's sentence
       spec   steps, with each stop's points shown too

     in the corner asks for the same answer in another form. -->

<script>window.SEE_PANE = () => { // the world's share of the panel, always centered; my words take the margin beside it (or below a tall panel)

  if (a < 0.95) return { x: 0, w: 1, h: 0.6 };

    const bh = bub.offsetHeight;

    bub.style.visibility = ar || composing ? 'hidden' : 'visible';
    // me: glued to the card I'm in (my words, or the box you type in), beside a question, or home
    let glued = null;
    if (ar) glued = null;
    else if (composing && point && point.screenFn) glued = point.screenFn();
    else if (bub.classList.contains('on')) glued = [bx - 18, by + 22];
    if (glued) { x = glued[0]; y = glued[1]; tx = x; ty = y; }
    else {
      const w = ar ? [ar.left - 20, ar.top + 22] : home();

  const viz = document.getElementById('viz');
  // (a click is the composer's: it calls ccPoint itself)
})();
