<!-- The talk dock: injected by the extension before the page's </body>. The transcript, a box to
     type in, and a click on the world to ask about the part nearest the click. -->
<style>
#see-dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg, #111);
  border-top: 1px solid var(--line, #2a2a28); font: 14px/1.5 Inter, -apple-system, system-ui, sans-serif;
  color: var(--ink, #ececea);
}
#see-log { max-height: 34vh; overflow-y: auto; padding: 10px 16px 4px; display: flex; flex-direction: column; gap: 8px; }
#see-log:empty { display: none; }
.see-m { max-width: 820px; white-space: pre-wrap; overflow-wrap: anywhere; }
.see-m.you { align-self: flex-end; background: color-mix(in srgb, var(--ink, #eee) 9%, transparent); padding: 4px 10px; border-radius: 10px; }
.see-m.you.click { font-style: italic; }
.see-m.claude { color: var(--ink, #ececea); }
.see-m.world { color: var(--soft, #b5b5b2); font-size: 13px; }
.see-m.world b { color: var(--accent, #ff7a4d); font-weight: 600; }
.see-m.status { color: var(--muted, #64645f); font-size: 13px; }
.see-m code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--line, #2a2a28); padding: 0 4px; border-radius: 3px; }
#see-form { display: flex; gap: 8px; padding: 8px 16px 12px; align-items: flex-end; }
#see-in {
  flex: 1; resize: none; font: inherit; color: inherit; background: color-mix(in srgb, var(--ink, #eee) 6%, transparent);
  border: 1px solid var(--line, #2a2a28); border-radius: 10px; padding: 7px 10px; min-height: 36px; max-height: 140px; outline: none;
}
#see-in:focus { border-color: var(--muted, #64645f); }
#see-send {
  font: inherit; font-size: 13px; color: var(--soft, #b5b5b2); background: none; cursor: pointer;
  border: 1px solid var(--line, #2a2a28); border-radius: 999px; padding: 6px 14px;
}
#see-send:hover { color: var(--ink, #ececea); border-color: var(--muted, #64645f); }
#see-hint { padding: 0 16px 8px; font-size: 12px; color: var(--muted, #64645f); }
.viz .label { pointer-events: auto; cursor: pointer; }
.viz .label:hover { color: var(--accent, #ff7a4d); }
.see-ping { position: fixed; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--accent, #ff7a4d); pointer-events: none; z-index: 60; animation: see-ping .7s ease-out forwards; }
@keyframes see-ping { to { transform: scale(2.6); opacity: 0; } }
</style>
<div id="see-dock">
  <div id="see-log"></div>
  <form id="see-form"><textarea id="see-in" rows="1" placeholder="Talk to Claude…  (Enter sends, Shift+Enter for a new line)"></textarea><button id="see-send" type="submit">Send</button></form>
  <div id="see-hint">Click a part of the world to ask about it.</div>
</div>
<script>
(() => {
  const vs = acquireVsCodeApi();
  const log = document.getElementById('see-log'), input = document.getElementById('see-in'), form = document.getElementById('see-form');
  const dock = document.getElementById('see-dock');
  let waiting = null;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

  function add(m, scroll = true) {
    if (m.who === 'claude' && waiting) { waiting.remove(); waiting = null; }
    const d = document.createElement('div'); if (m.at) d.dataset.at = m.at;
    if (m.who === 'you') { d.className = 'see-m you' + (m.kind === 'click' ? ' click' : ''); d.textContent = m.text; }
    else if (m.kind === 'status') { d.className = 'see-m status'; d.innerHTML = md(m.text); }
    else if (m.world) { d.className = 'see-m world'; d.innerHTML = '▲ <b>' + esc(m.world) + '</b>' + (m.text ? ' · ' + md(m.text) : ''); }
    else { d.className = 'see-m claude'; d.innerHTML = md(m.text); }
    // a status line is replaced by the next line from Claude
    const last = log.lastElementChild;
    if (m.who === 'claude' && last && last.classList.contains('status')) last.remove();
    log.appendChild(d);
    if (scroll) log.scrollTop = log.scrollHeight;
  }
  function wait() {
    if (waiting) return;
    waiting = document.createElement('div'); waiting.className = 'see-m status'; waiting.textContent = '…';
    log.appendChild(waiting); log.scrollTop = log.scrollHeight;
  }
  function send(text, extra) {
    text = text.trim(); if (!text) return;
    vs.postMessage(Object.assign({ type: 'say', text }, extra || {}));
  }

  addEventListener('message', e => {
    const m = e.data || {};
    if (m.type === 'talk') { log.innerHTML = ''; waiting = null; m.lines.forEach(l => add(l, false)); log.scrollTop = log.scrollHeight;
      const last = m.lines[m.lines.length - 1]; if (last && last.who === 'you') wait(); }
    if (m.type === 'append') m.lines.forEach(l => { add(l); if (l.who === 'you') wait(); });
  });

  form.addEventListener('submit', e => { e.preventDefault(); const d = input.dataset; send(input.value, d.part ? { kind: 'click', part: d.part, stop: d.stop || '' } : null); delete d.part; delete d.stop; input.value = ''; input.style.height = ''; });
  input.addEventListener('keydown', e => {
    e.stopPropagation(); // the world's ← → and space must not fire while typing
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener('input', () => { input.style.height = ''; input.style.height = Math.min(140, input.scrollHeight) + 'px'; });

  // keep the page's content clear of the dock
  const main = document.querySelector('main');
  if (main) new ResizeObserver(() => { main.style.paddingBottom = (dock.offsetHeight + 24) + 'px'; }).observe(dock);

  // a click (not a drag) on the world asks about the labelled part nearest it
  const viz = document.getElementById('viz');
  if (viz) {
    let down = null;
    viz.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; }, true);
    viz.addEventListener('pointerup', e => {
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 500;
      down = null;
      if (moved > 5 || !quick) return;
      let best = null, bestD = 90;
      for (const l of viz.querySelectorAll('.label')) {
        if (parseFloat(getComputedStyle(l).opacity) < 0.2) continue;
        const r = l.getBoundingClientRect();
        const ax = r.left - 7, ay = r.top + r.height / 2; // the label's dot marks its part
        const dx = e.clientX < r.left ? ax - e.clientX : e.clientX > r.right ? e.clientX - r.right : 0;
        const d = Math.hypot(dx, e.clientY - ay);
        if (d < bestD) { bestD = d; best = l; }
      }
      const ping = document.createElement('div'); ping.className = 'see-ping';
      ping.style.left = e.clientX + 'px'; ping.style.top = e.clientY + 'px'; document.body.appendChild(ping);
      setTimeout(() => ping.remove(), 800);
      if (!best) return;
      const now = document.querySelector('#steps li.now');
      let stop = '';
      if (now) { const c = now.cloneNode(true); c.querySelectorAll('.detail, .pts').forEach(x => x.remove()); stop = c.textContent.trim(); }
      const n = now ? [...now.parentNode.children].indexOf(now) + 1 : 0;
      send('Tell me more about “' + best.textContent.trim() + '”', { kind: 'click', part: best.textContent.trim(), stop: n ? n + ': ' + stop : '' });
    }, true);
  }
  vs.postMessage({ type: 'ready' });
})();
</script>
